# TLS gateway for the NDR platform (v0.12, compose profile "tls").
#
# Terminates HTTPS in front of ndr-ui (everything except /backend) and
# ndr-api (/backend/*, which the UI proxy also uses as its API base).
# Modern TLS only: TLS 1.2+1.3, strong ciphers, HSTS + baseline
# security headers (API also sets its own; nginx sets them for the UI
# as well).
#
# /backend/* is proxied WITH the prefix stripped (the Next.js rewrite
# in the UI does the same mapping: /backend/:path* -> api/:path*).

upstream ndr_ui { server ndr-ui:3000; }
upstream ndr_api { server ndr-api:8080; }

server {
    listen 80;
    # ACME challenge placeholder for real-cert deployments; everything
    # else redirects to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_trusted_certificate /etc/nginx/certs/ca.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:NDRTLS:10m;
    ssl_session_tickets off;

    # HSTS: only served because this vhost IS https (TLS_ENABLED=1 in
    # the API env enables the same header on API responses).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 5m;   # logo/favicon uploads (cap 300KB) + headroom

    # API: strip the /backend prefix exactly like the UI rewrite does
    location /backend/ {
        proxy_pass http://ndr_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Everything else: the Next.js UI (which itself proxies /backend,
    # but under the gateway those requests never reach the UI)
    location / {
        proxy_pass http://ndr_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
